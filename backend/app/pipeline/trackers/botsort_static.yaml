# BoT-SORT for FIXED cameras: global motion compensation switched off
# (it estimates camera movement, which a fixed junction camera does not have,
# and costs CPU). Other values as Ultralytics' botsort.yaml.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 30
match_thresh: 0.8
fuse_score: True
gmc_method: none
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False
model: auto
